<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Quorum Asesores JA</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2042C0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preload" href="assets/fonts/gambarino-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Gambarino'; src: url('assets/fonts/gambarino-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Ranade'; src: url('assets/fonts/ranade-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Ranade'; src: url('assets/fonts/ranade-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  :root {
    --azul: #2042C0; --noche: #0A1158; --bruma: #DCECEC; --tinta: #141A3F; --gris: #4E5677; --papel: #F5F9F9;
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --alto: min(62svh, 560px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--papel); color: var(--tinta);
    font-family: 'Ranade', 'Segoe UI', system-ui, sans-serif; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; border-radius: 4px; }

  .cab { background: #fff; border-bottom: 1px solid rgba(20, 26, 63, .13); padding: 12px var(--canal); }
  .cab a { display: inline-block; }
  .cab img { height: 46px; width: auto; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(56px, 10svh, 104px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Gambarino', Georgia, serif; font-weight: 400; font-size: clamp(1.9rem, 1.2rem + 2.4vw, 3.1rem); line-height: 1.12; text-wrap: balance; max-width: 20ch; }
  .mas { max-width: 34em; color: var(--gris); }
  .mas a { position: relative; color: var(--azul); font-weight: 500; text-decoration: none; overflow-wrap: anywhere; display: inline-block; }
  .mas a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: currentColor; transform-origin: left; transition: transform .4s var(--sale); }
  .mas a:hover::after { transform: scaleX(.3); }
  .mas a:active { opacity: .7; }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; border-radius: 14px; background: #fff;
    box-shadow: 0 0 0 1px rgba(20, 26, 63, .12), 0 30px 60px -28px rgba(10, 17, 88, .55); position: relative; }
  .ventana::after { content: ''; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 3px rgba(32, 66, 192, .4); pointer-events: none; }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(2) { animation-delay: .1s; }
    .ventana { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 56s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <a href="https://quorum.es/" aria-label="Quorum Asesores JA">
      <img src="assets/img/logo-quorum.png" width="287" height="66" alt="Quorum Asesores JA, SL · Gestión integral de pymes">
    </a>
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Quorum%20Asesores%20JA">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home propuesta">
        <img src="assets/img/home-miniatura.webp" width="480" height="2620" alt="Miniatura de la home propuesta para Quorum Asesores JA, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
