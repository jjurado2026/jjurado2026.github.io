<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Reformas Integrales Villalba</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F8FD">
<link rel="icon" href="assets/img/favicon-32.jpg" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/favicon-180.jpg">
<link rel="preload" href="assets/fonts/bespoke-stencil-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Bespoke Stencil'; src: url('assets/fonts/bespoke-stencil-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Cabinet Grotesk'; src: url('assets/fonts/cabinet-grotesk-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Cabinet Grotesk'; src: url('assets/fonts/cabinet-grotesk-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  :root {
    --naranja: #FF5E14; --negro: #1A1A1A; --grafito: #5A5A5A; --niebla: #F4F8FD; --acero: #CBD2DE;
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --alto: min(62svh, 560px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--niebla); color: var(--negro);
    font-family: 'Cabinet Grotesk', 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 2px solid var(--naranja); outline-offset: 3px; }

  .cab { background: var(--niebla); border-bottom: 1px solid var(--acero); padding: 22px var(--canal); }
  .cab a { display: inline-block; }
  .cab img { height: 24px; width: auto; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(56px, 10svh, 104px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Bespoke Stencil', Georgia, serif; font-weight: 400; font-size: clamp(1.9rem, 1.1rem + 2.6vw, 3.3rem); line-height: 1.12; text-wrap: balance; max-width: 20ch; }
  .barra { width: 72px; height: 4px; background: var(--naranja); }
  .mas { max-width: 34em; color: var(--grafito); }
  .mas a { position: relative; color: var(--negro); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; display: inline-block; }
  .mas a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--naranja); transform-origin: left; transition: transform .4s var(--sale); }
  .mas a:hover::after { transform: scaleX(.3); }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; position: relative; }
  .miniatura::before { content: ''; position: absolute; inset: 0; border: 2px solid var(--naranja); transform: translate(12px, 12px); }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; background: #fff; position: relative;
    box-shadow: 0 0 0 1px var(--acero), 0 30px 60px -28px rgba(26, 26, 26, .5); }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(3) { animation-delay: .1s; }
    .miniatura { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 56s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <a href="https://reformasintegralesvillalba.es/" aria-label="Reformas Integrales Villalba">
      <img src="assets/img/logo-negro.png" width="796" height="78" alt="Reformas Integrales Villalba">
    </a>
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <span class="barra" aria-hidden="true"></span>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Reformas%20Integrales%20Villalba">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home propuesta">
        <img src="assets/img/home-miniatura.webp" width="480" height="2636" alt="Miniatura de la home propuesta para Reformas Integrales Villalba, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
