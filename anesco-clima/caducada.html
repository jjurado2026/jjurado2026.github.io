<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no disponible | Anesco Clima &amp; Renovables</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f8f7">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<link rel="preload" href="assets/fonts/funnel-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Aviso de propuesta caducada: el texto del taller y la home entera en miniatura, que se recorre despacio */
  @font-face { font-family: 'Funnel Display'; src: url('assets/fonts/funnel-display.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  @font-face { font-family: 'Funnel Sans'; src: url('assets/fonts/funnel-sans.woff2') format('woff2'); font-weight: 300 800; font-display: swap; }
  :root {
    --pino: #143d3f; --lima: #7cb034; --cielo: #4ba7e5; --aire: #f5f8f7; --tinta-2: #4a6a6c; --linea: rgba(20, 61, 63, .14);
    --canal: clamp(16px, 5vw, 72px);
    --sale: cubic-bezier(.16, 1, .3, 1);
    --alto: min(62svh, 560px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr; background: var(--aire); color: var(--pino);
    font-family: 'Funnel Sans', 'Segoe UI', system-ui, sans-serif; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); line-height: 1.7;
    -webkit-font-smoothing: antialiased; overflow-x: clip; }
  img { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 2px solid var(--cielo); outline-offset: 3px; }

  .cab { border-bottom: 1px solid var(--linea); padding: 14px var(--canal); }
  .cab a { display: inline-block; }
  .cab img { height: 52px; width: auto; }

  .aviso { width: 100%; max-width: calc(1180px + 2 * var(--canal)); margin-inline: auto; padding: clamp(56px, 10svh, 104px) var(--canal) clamp(36px, 7svh, 80px);
    display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(40px, 7svh, 72px); align-items: center; }
  .aviso__texto { display: grid; gap: clamp(18px, 3svh, 28px); }
  h1 { font-family: 'Funnel Display', 'Segoe UI', sans-serif; font-weight: 650; font-size: clamp(1.9rem, 1.1rem + 2.6vw, 3.3rem); line-height: 1.1; text-wrap: balance; max-width: 20ch; }
  .barra { width: 72px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--cielo), var(--lima)); }
  .mas { max-width: 34em; color: var(--tinta-2); }
  .mas a { position: relative; color: var(--pino); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; display: inline-block; }
  .mas a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--lima); transform-origin: center; transition: transform .4s var(--sale); }
  .mas a:hover::after { transform: scaleX(.3); }

  .miniatura[hidden] { display: none; }
  .miniatura { justify-self: center; }
  .ventana { display: block; width: min(300px, 70vw); height: var(--alto); overflow: hidden; background: #fff; position: relative; border-radius: 22px;
    box-shadow: 0 0 0 1px var(--linea), 0 40px 70px -34px rgba(20, 61, 63, .5); }
  .ventana img { width: 100%; }
  @media (min-width: 900px) {
    .aviso { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: clamp(48px, 6vw, 96px); }
    .miniatura { justify-self: end; }
  }
  @keyframes entra { from { opacity: 0; transform: translateY(20px); } }
  @keyframes recorre { 0%, 6% { transform: none; } 94%, 100% { transform: translateY(calc(-100% + var(--alto))); } }
  @media (prefers-reduced-motion: no-preference) {
    .aviso__texto > * { animation: entra .9s var(--sale) both; }
    .aviso__texto > :nth-child(3) { animation-delay: .1s; }
    .miniatura { animation: entra 1s var(--sale) .25s both; }
    .ventana img { animation: recorre 56s ease-in-out 1.6s infinite alternate; }
    .ventana:hover img, .ventana:focus img { animation-play-state: paused; }
  }
  @media (prefers-reduced-motion: reduce) { .ventana { overflow-y: auto; } }
</style>
</head>
<body>
  <header class="cab">
    <a href="https://www.anescoclima.com/" aria-label="Anesco Clima &amp; Renovables">
      <img src="assets/img/logo.svg" width="1530" height="580" alt="AnescoClima &amp; Renovables">
    </a>
  </header>

  <main class="aviso">
    <div class="aviso__texto">
      <h1>No puedes ver esta página porque han pasado más de 10&nbsp;días desde su envío.</h1>
      <span class="barra" aria-hidden="true"></span>
      <p class="mas">Si sigues con interés, escríbeme a <a href="mailto:jjuradogarciadelrio@gmail.com?subject=Propuesta%20web%20Anesco%20Clima">jjuradogarciadelrio@gmail.com</a>.</p>
    </div>

    <figure class="miniatura">
      <span class="ventana" tabindex="0" aria-label="Miniatura de la home propuesta">
        <img src="assets/img/home-miniatura.webp" width="480" height="3340" alt="Miniatura de la home propuesta para Anesco Clima &amp; Renovables, completa de arriba abajo" onerror="this.closest('figure').hidden = true">
      </span>
    </figure>
  </main>
</body>
</html>
